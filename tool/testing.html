<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1714;
            --surface: #211e1a;
            --border: #2e2a25;
            --accent: #c9963a;
            --accent-dim: rgba(201, 150, 58, 0.12);
            --text-primary: #ede8e0;
            --text-secondary: #8a8278;
            --text-muted: #504c47;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 56px 52px 48px;
            position: relative;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Decorative quote mark */
        .card::before {
            content: '\201C';
            font-family: 'Playfair Display', serif;
            font-size: 9rem;
            line-height: 1;
            color: var(--accent);
            opacity: 0.18;
            position: absolute;
            top: 8px;
            left: 36px;
            pointer-events: none;
        }

        /* Accent line */
        .accent-line {
            width: 32px;
            height: 2px;
            background: var(--accent);
            margin-bottom: 32px;
        }

        /* Spinner */
        .spinner-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 160px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #content { display: none; }

        #quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.45rem;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 28px;
            letter-spacing: 0.01em;
        }

        #author {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        #author::before {
            content: "— ";
            opacity: 0.5;
        }

        .btn-row {
            display: flex;
            justify-content: flex-start;
        }

        button {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 10px 24px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        button:hover:not(:disabled) {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .error {
            color: #c0624a;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }

        /* Footer label */
        .footer-label {
            text-align: center;
            margin-top: 20px;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card" id="card">
            <div class="spinner-wrap" id="spinner">
                <div class="spinner"></div>
            </div>
            <div id="content">
                <div class="accent-line"></div>
                <div id="quote" role="text" aria-live="polite"></div>
                <div id="author" role="text"></div>
                <div id="error" class="error"></div>
                <div class="btn-row">
                    <button id="newQuoteBtn" aria-label="Get new quote">Next Quote</button>
                </div>
            </div>
        </div>
        <p class="footer-label">Daily Wisdom</p>
        <button id="copyBtn" aria-label="Copy quote" title="Copy to clipboard">Copy Quote</button>
    </div>

    <script>
        function fetchdata() {
            showLoading();
            const callbackName = "forismaticCallback_" + Math.random().toString(36).substring(2);
            let timeoutId;
            const cleanup = (script) => {
                clearTimeout(timeoutId);
                delete window[callbackName];
                if (script && script.parentNode) script.remove();
            };
            window[callbackName] = function(data) {
                if (data && data.quoteText) {
                    document.getElementById("quote").textContent = data.quoteText.trim();
                    document.getElementById("author").textContent = data.quoteAuthor || "Unknown";
                    document.getElementById("error").style.display = "none";
                    hideLoading();
                } else {
                    showError("Invalid quote data received");
                }
                cleanup(script);
            };
            const script = document.createElement("script");
            script.src = `https://api.forismatic.com/api/1.0/?method=getQuote&format=jsonp&lang=en&jsonp=${callbackName}`;
            script.onerror = () => { showError("Failed to load quote. Please try again."); cleanup(script); };
            timeoutId = setTimeout(() => { showError("Request timed out. Please try again."); cleanup(script); }, 10000);
            document.body.appendChild(script);
        }

        function showLoading() {
            document.getElementById("spinner").style.display = "flex";
            document.getElementById("content").style.display = "none";
            document.getElementById("newQuoteBtn").disabled = true;
        }

        function hideLoading() {
            setTimeout(() => {
                document.getElementById("spinner").style.display = "none";
                document.getElementById("content").style.display = "block";
                document.getElementById("newQuoteBtn").disabled = false;
                const card = document.getElementById("card");
                card.classList.remove("show");
                void card.offsetWidth;
                card.classList.add("show");
            }, 700);
        }

        function showError(msg) {
            const err = document.getElementById("error");
            err.textContent = msg;
            err.style.display = "block";
            document.getElementById("spinner").style.display = "none";
            document.getElementById("content").style.display = "block";
            document.getElementById("newQuoteBtn").disabled = false;
        }
        document.getElementById("copyBtn").addEventListener("click", () => {
    const quote = document.getElementById("quote").textContent;
    const author = document.getElementById("author").textContent;
    navigator.clipboard.writeText(`"${quote}" ${author}`).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 2000);
    });
});

document.addEventListener("keydown", (e) => {
    const btn = document.getElementById("newQuoteBtn");
    if ((e.code === "Space" || e.code === "ArrowRight") && !btn.disabled) {
        e.preventDefault();
        fetchdata();
    }
});


        fetchdata();
        document.getElementById("newQuoteBtn").addEventListener("click", fetchdata);
    </script>
</body>
</html>
