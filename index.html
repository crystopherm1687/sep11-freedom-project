<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1714;
      --surface: #211e1a;
      --border: #2e2a25;
      --accent: #c9963a;
      --accent-dim: rgba(201, 150, 58, 0.12);
      --text-primary: #ede8e0;
      --text-secondary: #8a8278;
      --text-muted: #504c47;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 56px 52px 48px;
      position: relative;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card::before {
      content: '\201C';
      font-family: 'Playfair Display', serif;
      font-size: 9rem;
      line-height: 1;
      color: var(--accent);
      opacity: 0.18;
      position: absolute;
      top: 8px;
      left: 36px;
      pointer-events: none;
    }

    .accent-line {
      width: 32px;
      height: 2px;
      background: var(--accent);
      margin-bottom: 18px;
    }

    .spinner-wrap, .qotd-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #content { display: none; }

    #quote, #qotd-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    #quote {
      font-size: 1.45rem;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    #author, #qotd-author {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #author {
      font-size: 0.8rem;
      margin-bottom: 18px;
    }

    #author::before, #qotd-author::before { content: "— "; opacity: 0.5; }

    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    select {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      border-radius: 2px;
      outline: none;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 10px 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    button:hover:not(:disabled) {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .error {
      color: #c0624a;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
    }

    .footer-label {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #qotd-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      cursor: pointer;
      width: fit-content;
    }

    .qotd-pill {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 2px;
      padding: 3px 8px;
      white-space: nowrap;
      opacity: 0.85;
    }

    .qotd-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    #qotd-panel {
      display: none;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 28px 32px 24px;
      position: relative;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #qotd-panel.open { display: block; }
    #qotd-panel.visible { opacity: 1; transform: translateY(0); }

    .qotd-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .qotd-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    #qotd-quote {
      font-size: 1.2rem;
      line-height: 1.7;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    #qotd-author {
      font-size: 0.75rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card" id="card">
      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
      </div>

      <div id="content">
        <div class="accent-line"></div>
        <div class="meta-row">
          <select id="categorySelect" aria-label="Filter quotes by category">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div id="quote" role="text" aria-live="polite"></div>
        <div id="author" role="text"></div>
        <div id="error" class="error"></div>
        <div class="btn-row">
          <button id="newQuoteBtn" aria-label="Get new quote">Next Quote</button>
          <button id="copyBtn" aria-label="Copy quote" title="Copy to clipboard">Copy Quote</button>
        </div>
      </div>
    </div>

    <p class="footer-label">Daily Wisdom</p>

    <div id="qotd-panel" role="region" aria-label="Quote of the day">
      <div class="qotd-label">
        <span>Quote of the Day</span>
        <button class="qotd-close" id="qotdCloseBtn" aria-label="Close">✕</button>
      </div>
      <div id="qotd-inner">
        <div class="qotd-spinner"><div class="spinner"></div></div>
      </div>
    </div>

    <div id="qotd-bar" role="button" tabindex="0" aria-label="Show quote of the day">
      <span class="qotd-pill">Quote of the Day</span>
      <span class="qotd-date" id="qotd-date"></span>
    </div>
  </div>

 <script>
  const quotes = [
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs", tags: ["success", "passion"] },
    { text: "Happiness is a choice that requires effort at times.", author: "Aeschylus", tags: ["happiness", "choice"] },
    { text: "You must expect great things of yourself before you can do them.", author: "Michael Jordan", tags: ["success", "belief"] },
    { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair", tags: ["fear", "success"] },
    { text: "The only person you should try to be better than is the person you were yesterday.", author: "Matty Mullins", tags: ["growth", "self-improvement"] },
    { text: "Do not wait to strike till the iron is hot; but make it hot by striking.", author: "William Butler Yeats", tags: ["action", "success"] },
    { text: "We write to taste life twice, in the moment and in retrospect.", author: "Anais Nin", tags: ["life", "creativity"] },
    { text: "Don't be afraid to give up the good to go for the great.", author: "John D. Rockefeller", tags: ["success", "courage"] },
    { text: "Life shrinks or expands in proportion to one's courage.", author: "Anais Nin", tags: ["courage", "life"] },
    { text: "You have to dream before your dreams can come true.", author: "A.P.J. Abdul Kalam", tags: ["dreams", "motivation"] },
    { text: "Keep your face always toward the sunshine and shadows will fall behind you.", author: "Walt Whitman", tags: ["positivity", "optimism"] },
    { text: "It is not the strongest of the species that survive, nor the most intelligent, but the one most responsive to change.", author: "Charles Darwin", tags: ["change", "growth"] },
    { text: "The most important thing is to enjoy your life—to be happy.", author: "Audrey Hepburn", tags: ["happiness", "life"] },
    { text: "The key to success is to focus on goals, not obstacles.", author: "Unknown", tags: ["success", "focus"] },
    { text: "You can never really change your life until you change something you do daily.", author: "John C. Maxwell", tags: ["habits", "growth"] },
    { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle", tags: ["excellence", "habits"] },
    { text: "Either you run the day, or the day runs you.", author: "Jim Rohn", tags: ["motivation", "productivity"] },
    { text: "Don't count the days, make the days count.", author: "Muhammad Ali", tags: ["life", "productivity"] },
    { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb", tags: ["action", "opportunity"] },
    { text: "If you want to be happy, set a goal that commands your thoughts, liberates your energy, and inspires your hopes.", author: "Andrew Carnegie", tags: ["happiness", "goals"] },
    { text: "The journey of a thousand miles begins with one step.", author: "Lao Tzu", tags: ["action", "perseverance"] },
    { text: "Courage is resistance to fear, mastery of fear — not absence of fear.", author: "Mark Twain", tags: ["courage", "fear"] },
    { text: "If you find serenity and happiness, some may be jealous. Be happy anyway.", author: "Mother Teresa", tags: ["happiness", "kindness"] },
    { text: "There is no path to happiness: happiness is the path.", author: "Buddha", tags: ["happiness", "philosophy"] },
    { text: "Start where you are. Use what you have. Do what you can.", author: "Arthur Ashe", tags: ["action", "motivation"] },
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt", tags: ["action", "resourcefulness"] },
    { text: "Always turn a negative situation into a positive situation.", author: "Michael Jordan", tags: ["positivity", "resilience"] },
    { text: "Your talent determines what you can do. Your motivation determines how much you are willing to do. Your attitude determines how well you do it.", author: "Lou Holtz", tags: ["motivation", "attitude"] },
    { text: "Failure is the condiment that gives success its flavor.", author: "Truman Capote", tags: ["failure", "success"] },
    { text: "Life is a journey, and if you fall in love with the journey, you will be in love forever.", author: "Peter Hagerty", tags: ["life", "joy"] },
    { text: "If you want to achieve greatness stop asking for permission.", author: "Unknown", tags: ["success", "courage"] },
    { text: "Difficulties break some men but make others.", author: "Nelson Mandela", tags: ["resilience", "growth"] },
    { text: "Happiness is not something you postpone for the future; it is something you design for the present.", author: "Jim Rohn", tags: ["happiness", "present"] },
    { text: "Don't let the noise of others' opinions drown out your own inner voice.", author: "Steve Jobs", tags: ["authenticity", "courage"] },
    { text: "If you want to live a happy life, tie it to a goal, not to people or things.", author: "Albert Einstein", tags: ["happiness", "goals"] },
    { text: "Your passion is waiting for your courage to catch up.", author: "Isabelle Lafleche", tags: ["passion", "courage"] },
    { text: "It is not the load that breaks you down, it's the way you carry it.", author: "Lou Holtz", tags: ["resilience", "mindset"] },
    { text: "Every strike brings me closer to the next home run.", author: "Babe Ruth", tags: ["failure", "success"] },
    { text: "The unexamined life is not worth living.", author: "Socrates", tags: ["wisdom", "life"] },
    { text: "A person who never made a mistake never tried anything new.", author: "Albert Einstein", tags: ["growth", "learning"] },
    { text: "If you build it, they will come.", author: "Joe Jackson (character)", tags: ["action", "success"] },
    { text: "The future belongs to those who prepare for it today.", author: "Malcolm X", tags: ["future", "preparation"] }
  ].map((q, i) => ({ ...q, id: i }));

  const categorySelect = document.getElementById("categorySelect");
  const quoteEl = document.getElementById("quote");
  const authorEl = document.getElementById("author");
  const errorEl = document.getElementById("error");
  const spinnerEl = document.getElementById("spinner");
  const contentEl = document.getElementById("content");
  const newQuoteBtn = document.getElementById("newQuoteBtn");
  const cardEl = document.getElementById("card");
  const qotdInner = document.getElementById("qotd-inner");
  const qotdDate = document.getElementById("qotd-date");
  const qotdPanel = document.getElementById("qotd-panel");

  const categories = [...new Set(quotes.flatMap(q => q.tags))].sort();
  const usedMainIds = new Set(JSON.parse(localStorage.getItem("usedMainIds") || "[]"));
  const usedQotdIds = new Set(JSON.parse(localStorage.getItem("usedQotdIds") || "[]"));

  function saveSets() {
    localStorage.setItem("usedMainIds", JSON.stringify([...usedMainIds]));
    localStorage.setItem("usedQotdIds", JSON.stringify([...usedQotdIds]));
  }

  categories.forEach(tag => {
    const opt = document.createElement("option");
    opt.value = tag;
    opt.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
    categorySelect.appendChild(opt);
  });

  function getFilteredQuotes() {
    const selected = categorySelect.value;
    return selected === "all"
      ? quotes
      : quotes.filter(q => q.tags.includes(selected));
  }

  function pickQuote(pool, usedSet) {
    let available = pool.filter(q => !usedSet.has(q.id));
    if (available.length === 0) {
      usedSet.clear();
      available = pool;
    }
    if (available.length === 0) return null;
    const picked = available[Math.floor(Math.random() * available.length)];
    usedSet.add(picked.id);
    saveSets();
    return picked;
  }

  function getNextMainQuote() {
    return pickQuote(getFilteredQuotes(), usedMainIds);
  }

  function getNextQotdQuote() {
    return pickQuote(quotes, usedQotdIds);
  }

  function renderQuote(q) {
    if (!q) {
      showError("No quotes found for this category.");
      return;
    }
    quoteEl.textContent = q.text;
    authorEl.textContent = q.author;
    errorEl.style.display = "none";
    hideLoading();
  }

  function fetchdata() {
    showLoading();
    setTimeout(() => renderQuote(getNextMainQuote()), 500);
  }

  function showLoading() {
    spinnerEl.style.display = "flex";
    contentEl.style.display = "none";
    newQuoteBtn.disabled = true;
  }

  function hideLoading() {
    setTimeout(() => {
      spinnerEl.style.display = "none";
      contentEl.style.display = "block";
      newQuoteBtn.disabled = false;
      cardEl.classList.remove("show");
      void cardEl.offsetWidth;
      cardEl.classList.add("show");
    }, 200);
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
    spinnerEl.style.display = "none";
    contentEl.style.display = "block";
    newQuoteBtn.disabled = false;
  }

  function todayKey() {
    const d = new Date();
    return `qotd_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
  }

  function formatDate() {
    return new Date().toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  function renderQotd(q) {
    qotdInner.innerHTML = `<div id="qotd-quote">${q.text}</div><div id="qotd-author">${q.author}</div>`;
  }

  function loadQotd() {
    const key = todayKey();
    const cached = localStorage.getItem(key);
    if (cached) {
      renderQotd(JSON.parse(cached));
      return;
    }
    const q = getNextQotdQuote();
    if (!q) {
      qotdInner.innerHTML = `<div id="qotd-quote">No quote available.</div><div id="qotd-author">Unknown</div>`;
      return;
    }
    const qotd = { text: q.text, author: q.author };
    localStorage.setItem(key, JSON.stringify(qotd));
    renderQotd(qotd);
  }

  function openQotd() {
    qotdPanel.classList.add("open");
    requestAnimationFrame(() => qotdPanel.classList.add("visible"));
    loadQotd();
  }

  function closeQotd() {
    qotdPanel.classList.remove("visible");
    setTimeout(() => qotdPanel.classList.remove("open"), 400);
  }

  function toggleQotd() {
    if (qotdPanel.classList.contains("open")) closeQotd();
    else openQotd();
  }

  document.getElementById("copyBtn").addEventListener("click", () => {
    const quote = quoteEl.textContent;
    const author = authorEl.textContent;
    navigator.clipboard.writeText(`"${quote}" — ${author}`).then(() => {
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy Quote", 2000);
    });
  });

  document.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "ArrowRight") && !newQuoteBtn.disabled) {
      e.preventDefault();
      fetchdata();
    }
  });

  newQuoteBtn.addEventListener("click", fetchdata);
  categorySelect.addEventListener("change", fetchdata);

  document.getElementById("qotd-bar").addEventListener("click", toggleQotd);
  document.getElementById("qotd-bar").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggleQotd();
    }
  });
  document.getElementById("qotdCloseBtn").addEventListener("click", closeQotd);

  qotdDate.textContent = formatDate();
  fetchdata();
</script>
</body>
</html>
